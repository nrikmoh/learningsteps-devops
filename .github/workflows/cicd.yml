name: CI/CD Pipeline

on:
  push:
    branches: [reference]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -- Secret Scanning (Gap 1) --
      - name: TruffleHog - secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      # -- Python Lint and Tests (Gap 2) --
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint and test tools
        run: pip install flake8 pytest

      - name: Flake8 - lint Python code
        run: flake8 api/ --max-line-length=120 --ignore=E501,W503,E402
        continue-on-error: true

      - name: Pytest - run tests
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v
          else
            echo "No tests directory found. Skipping."
          fi
        continue-on-error: true

      # -- Docker Scanning --
      - name: Build Docker image
        run: docker build -t learningsteps-api:latest .

      - name: Hadolint - scan Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Trivy - scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: learningsteps-api:latest
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # -- Python Code Scanning --
      - name: Bandit - scan Python code
        run: |
          pip install bandit
          bandit -r api/ -ll -ii
        continue-on-error: true

      - name: pip-audit - scan Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt
        continue-on-error: true

      - name: Semgrep - deep code analysis
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
        continue-on-error: true

      # -- Infrastructure Scanning --
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform fmt check
        working-directory: infra-terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra-terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: tfsec - scan Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra-terraform
          soft_fail: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov - scan IaC, K8s, Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile
          soft_fail: true

      - name: Kube-score - scan K8s manifests
        run: |
          curl -sL https://github.com/zegl/kube-score/releases/download/v1.19.0/kube-score_1.19.0_linux_amd64.tar.gz | tar xz
          ./kube-score score k8s/*.yml || true
        continue-on-error: true

      # -- Push to ACR --
      - name: Login to ACR
        uses: docker/login-action@v4
        with:
          registry: nrikmohacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag and push image to ACR
        run: |
          docker tag learningsteps-api:latest nrikmohacr.azurecr.io/learningsteps-api:${{ github.sha }}
          docker tag learningsteps-api:latest nrikmohacr.azurecr.io/learningsteps-api:latest
          docker push nrikmohacr.azurecr.io/learningsteps-api:${{ github.sha }}
          docker push nrikmohacr.azurecr.io/learningsteps-api:latest

  deploy:
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: rg-learningsteps-devops
          cluster-name: learningsteps-aks

      - name: Deploy to AKS
        uses: azure/k8s-deploy@v5
        with:
          namespace: learningsteps
          manifests: |
            k8s/namespace.yml
            k8s/configmap.yml
            k8s/deployment.yml
            k8s/service.yml
            k8s/hpa.yml
            k8s/pdb.yml
            k8s/networkpolicy.yml
          images: |
            nrikmohacr.azurecr.io/learningsteps-api:${{ github.sha }}