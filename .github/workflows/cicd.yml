name: CI/CD Pipeline

on:
  push:
    branches: [reference]

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t learningsteps-api:latest .

      - name: Trivy - scan Docker image
        uses: aquasecurity/trivy-action@master  # TODO: pin to release SHA for production
        with:
          image-ref: learningsteps-api:latest
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Terraform fmt check
        working-directory: infra-terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: infra-terraform
        run: |
          terraform init -backend=false
          terraform validate

      - name: tfsec - scan Terraform
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infra-terraform
          soft_fail: true

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: nrikmohacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Tag and push image to ACR
        run: |
          docker tag learningsteps-api:latest nrikmohacr.azurecr.io/learningsteps-api:${{ github.sha }}
          docker tag learningsteps-api:latest nrikmohacr.azurecr.io/learningsteps-api:latest
          docker push nrikmohacr.azurecr.io/learningsteps-api:${{ github.sha }}
          docker push nrikmohacr.azurecr.io/learningsteps-api:latest