apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: learningsteps-netpol
  namespace: learningsteps
spec:
  podSelector:
    matchLabels:
      app: learningsteps
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.2.0/24
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
