apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: learningsteps-api-monitor
  namespace: learningsteps
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: learningsteps
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - learningsteps
