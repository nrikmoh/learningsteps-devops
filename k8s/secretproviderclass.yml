apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: learningsteps-kv-secrets
  namespace: learningsteps
spec:
  provider: azure
  secretObjects:
    - secretName: learningsteps-secrets
      type: Opaque
      data:
        - objectName: pg-connection-string
          key: database-url
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "a4d6cc94-c12e-47e2-8f34-aa750af35381"
    keyvaultName: "kv-learningsteps-mk"
    tenantId: "c0531484-50fa-4ff2-97df-b1f2d4810603"
    objects: |
      array:
        - |
          objectName: pg-connection-string
          objectType: secret


